name: 'Start R2R Server'
description: 'Starts the R2R server'
runs:
  using: "composite"
  steps:
    - name: Build local R2R Docker image
      shell: bash
      run: |
        docker build -t r2r/local py

    - name: Start R2R Full stack via Docker Compose
      shell: bash
      run: |
        export R2R_CONFIG_NAME=full_azure
        export R2R_IMAGE=r2r/local
        docker compose -f docker/compose.full.yaml --project-name r2r-full up -d
